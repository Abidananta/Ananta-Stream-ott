name: Build Ananta OTT APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --org com.ananta --project-name ott build_app
      - name: Configure Android identity, PiP and stable signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, os
          root=Path('build_app/android/app')
          gradle=root/'build.gradle.kts'
          gs=gradle.read_text()
          if 'applicationId = "com.ananta.ott"' not in gs:
              gs=gs.replace('defaultConfig {','defaultConfig {\n        applicationId = "com.ananta.ott"',1)
          if 'keystorePropertiesFile' not in gs:
              gs='import java.util.Properties\nval keystoreProperties = Properties()\nval keystorePropertiesFile = rootProject.file("android/app/keystore.properties")\nif (keystorePropertiesFile.exists()) keystoreProperties.load(keystorePropertiesFile.inputStream())\n'+gs
          if 'signingConfigs {' not in gs:
              block='''android {
              signingConfigs {
                  create("release") {
                      storeFile = file("release-keystore.jks")
                      storePassword = keystoreProperties["storePassword"] as String
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                  }
              }'''
              gs=gs.replace('android {',block,1)
          if 'signingConfig = signingConfigs.getByName("release")' not in gs:
              gs=gs.replace('release {','release {\n            signingConfig = signingConfigs.getByName("release")',1)
          gradle.write_text(gs)
          required=['ANDROID_KEYSTORE_BASE64','ANDROID_KEYSTORE_PASSWORD','ANDROID_KEY_ALIAS','ANDROID_KEY_PASSWORD']
          if not all(os.environ.get(k) for k in required):
              raise SystemExit('Stable release signing secrets are required: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD')
          (root/'release-keystore.jks').write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64']))
          (root/'keystore.properties').write_text('storeFile=release-keystore.jks\nstorePassword='+os.environ['ANDROID_KEYSTORE_PASSWORD']+'\nkeyAlias='+os.environ['ANDROID_KEY_ALIAS']+'\nkeyPassword='+os.environ['ANDROID_KEY_PASSWORD']+'\n')
          activity=root/'src/main/kotlin/com/ananta/ott/MainActivity.kt'
          activity.parent.mkdir(parents=True,exist_ok=True)
          activity.write_text(r'''package com.ananta.ott
          
          import android.app.PictureInPictureParams
          import android.content.pm.PackageManager
          import android.graphics.Rect
          import android.os.Build
          import android.util.Log
          import android.util.Rational
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          
          class MainActivity : FlutterActivity() {
              companion object { private const val TAG = "AnantaPiP" }
              private val channelName = "com.ananta.ott/pip"
              private fun isTv(): Boolean = packageManager.hasSystemFeature(PackageManager.FEATURE_LEANBACK)
          
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channelName).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "enterPictureInPicture" -> result.success(enterPip())
                          "isPictureInPicture" -> result.success(Build.VERSION.SDK_INT >= Build.VERSION_CODES.N && isInPictureInPictureMode)
                          else -> result.notImplemented()
                      }
                  }
              }
          
              override fun onUserLeaveHint() {
                  super.onUserLeaveHint()
                  if (!isTv()) enterPip()
              }
          
              private fun enterPip(): Boolean {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O || isFinishing || isTv()) return false
                  return try {
                      val width = resources.displayMetrics.widthPixels
                      val height = (width * 9L / 16L).toInt()
                      val builder = PictureInPictureParams.Builder()
                          .setAspectRatio(Rational(16, 9))
                          .setSourceRectHint(Rect(0, 0, width, height))
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) builder.setAutoEnterEnabled(true)
                      enterPictureInPictureMode(builder.build())
                  } catch (t: Throwable) {
                      Log.e(TAG, "PiP entry failed", t)
                      false
                  }
              }
          
              override fun onPictureInPictureModeChanged(isInPictureInPictureMode: Boolean) {
                  super.onPictureInPictureModeChanged(isInPictureInPictureMode)
                  Log.d(TAG, "PiP changed: $isInPictureInPictureMode")
              }
          }
          ''')
          manifest=root/'src/main/AndroidManifest.xml'
          ms=manifest.read_text()
          ms=ms.replace('<application ', '<application android:label="Ananta OTT" android:icon="@drawable/ananta_launcher_icon" android:banner="@drawable/ananta_tv_banner" android:usesCleartextTraffic="true" ',1)
          ms=ms.replace('android:exported="true"','android:exported="true" android:supportsPictureInPicture="true" android:resizeableActivity="true" android:configChanges="orientation|screenSize|smallestScreenSize|keyboardHidden|uiMode"',1)
          manifest.write_text(ms)
          PY
      - name: Copy app source and assets
        run: |
          cp lib/main.dart build_app/lib/main.dart
          cp lib/update_checker.dart build_app/lib/update_checker.dart
          cp pubspec.yaml build_app/pubspec.yaml
          rm -rf build_app/test
          mkdir -p build_app/android/app/src/main/res/drawable-nodpi
          cp assets/ananta_launcher_icon.png build_app/android/app/src/main/res/drawable-nodpi/ananta_launcher_icon.png
          cp assets/ananta_tv_banner.png build_app/android/app/src/main/res/drawable-nodpi/ananta_tv_banner.png
      - name: Resolve dependencies
        working-directory: build_app
        run: flutter pub get
      - name: Analyze
        working-directory: build_app
        run: flutter analyze --no-pub
      - name: Verify version
        working-directory: build_app
        run: "grep -q 'version: 1.0.7+8' pubspec.yaml"
      - name: Build signed release APK
        working-directory: build_app
        run: flutter build apk --release --no-pub
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ananta-ott-1.0.7-release
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.7
          name: Ananta OTT v1.0.7
          body: |
            ## Ananta OTT v1.0.7
            - Fixed Android mobile Picture-in-Picture entry and return behavior.
            - Preserves active channel/player state when returning from PiP.
            - Keeps TV behavior out of phone/tablet PiP handling.
            - Uses stable release signing so future APKs can update in place.
          files: build_app/build/app/outputs/flutter-apk/app-release.apk
          overwrite_files: true
          make_latest: true

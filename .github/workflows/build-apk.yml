name: Build Ananta OTT APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          java -version

      - name: Generate Android project scaffolding
        run: flutter create --platforms=android --org com.ananta --project-name ott build_app

      - name: Copy app source and configure Android TV manifest
        shell: bash
        run: |
          set -euo pipefail
          cp lib/main.dart build_app/lib/main.dart
          cp pubspec.yaml build_app/pubspec.yaml
          mkdir -p build_app/android/app/src/main/res/drawable-nodpi
          cp assets/ananta_launcher_icon.png build_app/android/app/src/main/res/drawable-nodpi/ananta_launcher_icon.png
          cp assets/ananta_tv_banner.png build_app/android/app/src/main/res/drawable-nodpi/ananta_tv_banner.png
          python3 - <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          manifest = Path('build_app/android/app/src/main/AndroidManifest.xml')
          android = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', android)
          ns = '{' + android + '}'
          tree = ET.parse(manifest)
          root = tree.getroot()
          def has_root_tag(tag, attr, value):
              return any(el.tag == tag and el.get(ns + attr) == value for el in root)
          if not has_root_tag('uses-permission', 'name', 'android.permission.INTERNET'):
              el = ET.Element('uses-permission', {ns + 'name': 'android.permission.INTERNET'})
              root.insert(0, el)
          if not has_root_tag('uses-feature', 'name', 'android.hardware.touchscreen'):
              el = ET.Element('uses-feature', {ns + 'name': 'android.hardware.touchscreen', ns + 'required': 'false'})
              root.insert(1, el)
          app = root.find('application')
          if app is None:
              raise RuntimeError('Generated AndroidManifest.xml has no application element')
          app.set(ns + 'label', 'Ananta OTT')
          app.set(ns + 'icon', '@drawable/ananta_launcher_icon')
          app.set(ns + 'banner', '@drawable/ananta_tv_banner')
          app.set(ns + 'usesCleartextTraffic', 'true')
          launcher = None
          for activity in app.findall('activity'):
              for filt in activity.findall('intent-filter'):
                  cats = [c.get(ns + 'name') for c in filt.findall('category')]
                  actions = [a.get(ns + 'name') for a in filt.findall('action')]
                  if 'android.intent.action.MAIN' in actions and 'android.intent.category.LAUNCHER' in cats:
                      launcher = activity
                      break
              if launcher is not None:
                  break
          if launcher is None:
              raise RuntimeError('Could not find Flutter launcher activity in generated manifest')
          has_leanback = any(
              'android.intent.category.LEANBACK_LAUNCHER' in [c.get(ns + 'name') for c in f.findall('category')]
              for f in launcher.findall('intent-filter')
          )
          if not has_leanback:
              filt = ET.SubElement(launcher, 'intent-filter')
              ET.SubElement(filt, 'action', {ns + 'name': 'android.intent.action.MAIN'})
              ET.SubElement(filt, 'category', {ns + 'name': 'android.intent.category.LEANBACK_LAUNCHER'})
          tree.write(manifest, encoding='utf-8', xml_declaration=True)
          print(manifest.read_text())
          PYTHON

      - name: Resolve dependencies
        working-directory: build_app
        run: flutter pub get -v

      # Analyzer lint/deprecation warnings should not block an otherwise valid
      # release build. Compilation errors will still fail the build step below.
      - name: Analyze source (diagnostic only)
        working-directory: build_app
        continue-on-error: true
        run: flutter analyze --no-pub

      - name: Build release APK
        working-directory: build_app
        run: flutter build apk --release --no-pub --verbose

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ananta-ott-android-tv-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic logs if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ananta-ott-build-diagnostics
          path: |
            build_app/.dart_tool/package_config.json
            build_app/build/**/outputs/**/output-metadata.json
          if-no-files-found: ignore
          retention-days: 7

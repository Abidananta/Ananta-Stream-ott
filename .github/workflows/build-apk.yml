name: Build Ananta OTT APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org com.ananta --project-name ananta_ott build_app

      - name: Copy source and configure Android TV
        shell: bash
        run: |
          set -euo pipefail
          cp lib/main.dart build_app/lib/main.dart
          cp pubspec.yaml build_app/pubspec.yaml
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('build_app/android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          # Ensure internet permission exists exactly once.
          if 'android.permission.INTERNET' not in text:
              text = text.replace('<manifest ', '<manifest ', 1)
              text = text.replace('>', '>\n    <uses-permission android:name="android.permission.INTERNET" />', 1)
          # TV devices often have no touchscreen.
          if 'android.hardware.touchscreen' not in text:
              text = text.replace('<application', '<uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n    <application', 1)
          # The app uses an HTTP IPTV URL as well as HTTPS playlists.
          if 'android:usesCleartextTraffic=' in text:
              text = re.sub(r'android:usesCleartextTraffic="[^"]*"', 'android:usesCleartextTraffic="true"', text, count=1)
          else:
              text = text.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          text = text.replace('android:label="ananta_ott"', 'android:label="Ananta OTT"')
          # Add the Leanback launcher category to the existing MAIN/LAUNCHER activity.
          if 'android.intent.category.LEANBACK_LAUNCHER' not in text:
              launcher = re.search(r'(<intent-filter>\s*<action android:name="android.intent.action.MAIN"\s*/>\s*<category android:name="android.intent.category.LAUNCHER"\s*/>\s*</intent-filter>)', text)
              if launcher:
                  tv_filter = launcher.group(1).replace('</intent-filter>', '    <category android:name="android.intent.category.LEANBACK_LAUNCHER" />\n            </intent-filter>')
                  text = text[:launcher.start()] + tv_filter + text[launcher.end():]
          manifest.write_text(text)
          print('Configured manifest:', manifest)
          PY

      - name: Resolve dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Analyze Dart source
        working-directory: build_app
        run: flutter analyze --no-pub || echo "Analyzer reported issues; continuing so the release build can show any blocking compiler errors."

      - name: Build release APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ananta-ott-android-tv-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

name: Build Ananta OTT APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'

# GitHub Actions needs write access to create a GitHub Release and upload the APK.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Java and Flutter
        run: |
          java -version
          flutter --version

      - name: Generate Android project scaffolding
        run: flutter create --platforms=android --org com.ananta --project-name ott build_app

      - name: Copy app source and configure Android TV icon and manifest
        run: |
          test -f lib/main.dart
          test -f lib/update_checker.dart
          cp lib/main.dart build_app/lib/main.dart
          cp lib/update_checker.dart build_app/lib/update_checker.dart
          cp pubspec.yaml build_app/pubspec.yaml
          # Flutter's generated test imports package:ott and MyApp, which do not
          # exist in this app. Remove that template test from the temporary build.
          rm -rf build_app/test
          # Guard a nullable EPG program in repository revisions that use this
          # display expression. The current source may already have the fix.
          python3 - <<'PYFIX'
          from pathlib import Path
          p = Path('build_app/lib/main.dart')
          s = p.read_text()
          s = s.replace(
              'Text(_epgLabelForProgram(program),',
              'if (program != null) Text(_epgLabelForProgram(program),'
          )
          p.write_text(s)
          PYFIX
          mkdir -p build_app/android/app/src/main/res/drawable-nodpi
          cp assets/ananta_launcher_icon.png build_app/android/app/src/main/res/drawable-nodpi/ananta_launcher_icon.png
          cp assets/ananta_tv_banner.png build_app/android/app/src/main/res/drawable-nodpi/ananta_tv_banner.png
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          manifest = Path('build_app/android/app/src/main/AndroidManifest.xml')
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          ns = '{http://schemas.android.com/apk/res/android}'
          tree = ET.parse(manifest)
          root = tree.getroot()
          def has_tag(tag, attr, value):
              return any(el.tag == tag and el.get(ns + attr) == value for el in root)
          if not has_tag('uses-permission', 'name', 'android.permission.INTERNET'):
              el = ET.Element('uses-permission'); el.set(ns + 'name', 'android.permission.INTERNET'); root.insert(0, el)
          if not has_tag('uses-feature', 'name', 'android.hardware.touchscreen'):
              el = ET.Element('uses-feature'); el.set(ns + 'name', 'android.hardware.touchscreen'); el.set(ns + 'required', 'false'); root.insert(1, el)
          app = root.find('application')
          app.set(ns + 'label', 'Ananta OTT')
          app.set(ns + 'icon', '@drawable/ananta_launcher_icon')
          app.set(ns + 'banner', '@drawable/ananta_tv_banner')
          app.set(ns + 'usesCleartextTraffic', 'true')
          activities = list(app.findall('activity'))
          launcher = None
          for activity in activities:
              for filt in activity.findall('intent-filter'):
                  cats = [c.get(ns + 'name') for c in filt.findall('category')]
                  if 'android.intent.category.LAUNCHER' in cats:
                      launcher = activity
                      break
              if launcher is not None: break
          if launcher is None and activities:
              launcher = activities[0]
          if launcher is not None:
              has_leanback = any('android.intent.category.LEANBACK_LAUNCHER' in [c.get(ns + 'name') for c in f.findall('category')] for f in launcher.findall('intent-filter'))
              if not has_leanback:
                  filt = ET.SubElement(launcher, 'intent-filter')
                  action = ET.SubElement(filt, 'action'); action.set(ns + 'name', 'android.intent.action.MAIN')
                  category = ET.SubElement(filt, 'category'); category.set(ns + 'name', 'android.intent.category.LEANBACK_LAUNCHER')
          tree.write(manifest, encoding='utf-8', xml_declaration=True)
          PY


      - name: Enable Android Picture-in-Picture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import re

          android_dir = Path('build_app/android/app/src/main')
          manifest = android_dir / 'AndroidManifest.xml'
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          ns = '{http://schemas.android.com/apk/res/android}'
          tree = ET.parse(manifest)
          manifest_root = tree.getroot()
          app = manifest_root.find('application')
          if app is None:
              raise SystemExit('AndroidManifest.xml has no application element')

          launcher = None
          for activity in app.findall('activity'):
              for filt in activity.findall('intent-filter'):
                  actions = [x.get(ns + 'name') for x in filt.findall('action')]
                  categories = [x.get(ns + 'name') for x in filt.findall('category')]
                  if 'android.intent.action.MAIN' in actions and 'android.intent.category.LAUNCHER' in categories:
                      launcher = activity
                      break
              if launcher is not None:
                  break
          if launcher is None:
              raise SystemExit('Could not find launcher activity for PiP setup')

          launcher.set(ns + 'supportsPictureInPicture', 'true')
          launcher.set(ns + 'resizeableActivity', 'true')
          needed = {'screenSize', 'smallestScreenSize', 'screenLayout', 'orientation'}
          existing = set(filter(None, launcher.get(ns + 'configChanges', '').split('|')))
          launcher.set(ns + 'configChanges', '|'.join(sorted(existing | needed)))
          tree.write(manifest, encoding='utf-8', xml_declaration=True)

          # Flutter templates can generate an empty Kotlin class without braces.
          kotlin_files = list((android_dir / 'kotlin').rglob('MainActivity.kt'))
          if not kotlin_files:
              raise SystemExit('MainActivity.kt not found in generated Android project')
          activity = kotlin_files[0]
          source = activity.read_text()
          if 'override fun onUserLeaveHint()' not in source:
              imports = [
                  'import android.app.PictureInPictureParams',
                  'import android.os.Build',
                  'import android.util.Rational',
              ]
              package_match = re.search(r'(?m)^package\s+[\w.]+\s*$', source)
              if package_match:
                  insert_at = package_match.end()
                  source = source[:insert_at] + '\n\n' + '\n'.join(
                      item for item in imports if item not in source
                  ) + source[insert_at:]
              else:
                  source = '\n'.join(imports) + '\n' + source

              method = '''
              override fun onUserLeaveHint() {
                  super.onUserLeaveHint()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      try {
                          val params = PictureInPictureParams.Builder()
                              .setAspectRatio(Rational(16, 9))
                              .build()
                          enterPictureInPictureMode(params)
                      } catch (_: Exception) {
                          // PiP is not available on every device.
                      }
                  }
              }
              '''

              # Handle both `class MainActivity : FlutterActivity()` and a class
              # declaration that already has a body.
              class_match = re.search(
                  r'class\s+MainActivity\s*:\s*FlutterActivity\s*\(\s*\)\s*(\{)?',
                  source
              )
              if not class_match:
                  raise SystemExit('Could not find MainActivity : FlutterActivity() declaration')
              if class_match.group(1):
                  closing = source.rfind('}')
                  if closing <= class_match.end():
                      raise SystemExit('Could not find MainActivity class closing brace')
                  source = source[:closing] + method + '\n' + source[closing:]
              else:
                  source = source[:class_match.end()] + ' {\n' + method + '\n}\n' + source[class_match.end():]
              activity.write_text(source)
          PY

      - name: Configure transparent launch window
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          base = Path('build_app/android/app/src/main/res')
          for path in base.glob('values*/styles.xml'):
              text = path.read_text()
              # Remove a forced white/black launch background; transparent launch is intentional.
              text = re.sub(r'<item name=\"android:windowBackground\">.*?</item>', '<item name=\"android:windowBackground\">@android:color/transparent</item>', text, flags=re.S)
              if 'LaunchTheme' in text and 'windowDisablePreview' not in text:
                  text = text.replace('</style>', '        <item name=\"android:windowDisablePreview\">true</item>\n    </style>', 1)
              path.write_text(text)
          PYCODE

      - name: Resolve dependencies
        working-directory: build_app
        run: flutter pub get -v

      - name: Analyze source (diagnostic only)
        working-directory: build_app
        continue-on-error: true
        run: flutter analyze --no-pub

      - name: Build release APK
        working-directory: build_app
        run: flutter build apk --release --no-pub --verbose

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ananta-ott-android-tv-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release and upload APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Ananta OTT ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: build_app/build/app/outputs/flutter-apk/app-release.apk

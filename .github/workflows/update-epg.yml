name: Update EPG files

# Refreshes the EPG files in /epg (read by the app from GitHub) and /assets/epg
# (the offline copy bundled in the APK) from the live feeds.
# Commits made with GITHUB_TOKEN do not trigger build-apk.yml, so no APK rebuild loop.

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */6 * * *'   # every 6 hours (UTC)

permissions:
  contents: write

concurrency:
  group: update-epg
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download live EPG feeds
        run: |
          set -u
          fetch() {   # fetch <url> <repo path>
            url="$1"; rel="$2"; tmp="$(mktemp)"
            if ! curl -fsSL --retry 3 --retry-delay 5 --max-time 120 \
                 -A "AnantaOTT-EPG-Updater/1.0" -o "$tmp" "$url"; then
              echo "::warning::Download failed: $url (keeping old $rel)"; return 0
            fi
            # Must be a real gzip, contain XMLTV, and not be tiny.
            if ! gzip -t "$tmp" 2>/dev/null; then
              echo "::warning::Not a valid gzip: $url (keeping old $rel)"; return 0
            fi
            if [ "$(stat -c%s "$tmp")" -lt 100000 ] || ! zcat "$tmp" | head -c 4096 | grep -q "<tv"; then
              echo "::warning::Feed looks empty/invalid: $url (keeping old $rel)"; return 0
            fi
            for dest in "epg/$rel" "assets/epg/$rel"; do
              mkdir -p "$(dirname "$dest")"
              cp "$tmp" "$dest"
            done
            echo "Updated $rel from $url ($(stat -c%s "$tmp") bytes)"
          }
          fetch "https://avkb.short.gy/epg.xml.gz"    "epg.xml.gz"
          fetch "https://avkb.short.gy/tsepg.xml.gz"  "tataplay/epg.xml.gz"
          fetch "https://avkb.short.gy/jioepg.xml.gz" "jiotv/epg.xml.gz"

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg assets/epg
          if git diff --cached --quiet; then
            echo "No EPG changes."
          else
            git commit -m "chore: update EPG ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
